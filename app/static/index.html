<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Latent Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,500&family=IBM+Plex+Sans:wght@350;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
  <h1>Latent Lab
    <nav class="tabs" aria-label="pages"><a href="/" aria-current="page">lab</a><a href="/editor.html">editor</a><a href="/mapping.html">mapping</a><a href="/hidden.html">hidden</a><a href="/tokens.html">tokens</a></nav>
    <span id="engineBadge"></span></h1>
  <div class="toprow">
    <div id="recipes" title="recipes: every setting of a picture, saved under a name">
      <select id="recipeSel" aria-label="recipe"></select>
      <button id="recipeLoad">load</button>
      <button id="recipeSave">save…</button>
    </div>
    <button id="explain" aria-pressed="false" title="also write what each setting does under it">explanations</button>
    <div id="jobsLight" title="queue">·</div>
  </div>
</header>
<main>
  <nav id="rail" aria-label="methods"></nav>
  <section id="stage">
    <div id="viewerWrap">
      <div id="holdPane" hidden><canvas id="holdCanvas" aria-label="held frame"></canvas><button id="unhold">×</button></div>
      <div id="viewer"><canvas id="mainCanvas" aria-label="live frame"></canvas><div id="marks"></div><div id="note"></div></div>
    </div>
    <div id="strip" aria-label="history"></div>
  </section>
  <aside id="panel">
    <div id="modes" class="block" hidden></div>
    <div id="methodDoc"></div>
    <div id="inputs"></div>
    <div id="params"></div>
    <div id="jobsBox" class="block" hidden>
      <div class="lab" id="jobsHead">jobs</div>
      <div id="jobsList"></div>
    </div>
    <div id="foot">
      <div id="help" aria-live="polite"></div>
      <div class="runrow">
        <button id="render" class="primary" title="space">render</button>
        <label class="auto" title="live: redraw as you move, rough while you drag and sharp when you let go"><input type="checkbox" id="auto" checked> live</label>
        <button id="keep" title="K — save this frame and its settings to the strip below the picture">keep</button>
        <button id="hold" title="H — pin this frame beside the live one to compare">hold</button>
        <button id="export" hidden title="export: render these settings at the picture's original, full resolution">export</button>
      </div>
    </div>
  </aside>
</main>
<div id="drawer" hidden>
  <div id="drawerCard">
    <div class="runrow">
      <span class="lab" id="acount">the archive</span>
      <input type="text" id="aq" placeholder="search captions…">
      <select id="asort"><option value="">file order</option></select>
      <button id="aprev">‹</button><span class="lab" id="apage"></span><button id="anext">›</button>
      <button id="aclose">close</button>
    </div>
    <div id="agrid"></div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
